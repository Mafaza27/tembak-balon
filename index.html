<script>
const $=id=>document.getElementById(id);
const COL=['#e74c3c','#3498db','#27ae60','#9b59b6','#e67e22','#16a085','#f1c40f'];
const PC=['#00e5ff','#ff3030','#30ff30','#ffff30'];
let N=1,mission=null,G=null,snd=true,pk=[],tabIdx=0,board={};
const L=s=>{try{return JSON.parse(localStorage.getItem(s))}catch(e){return null}};
const W=(s,v)=>{try{localStorage.setItem(s,JSON.stringify(v))}catch(e){}};
pk=L('pb_pk')||[];board=L('pb_bd')||{};
const A=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
const SK=[];'BCDKLMNPRST'.split('').forEach(c=>'AIUEO'.split('').forEach(v=>SK.push(c+v)));
const NUM=[...'0123456789'];
const MS=[{id:'h',n:'HURUF (A, B, C)',s:'Mengenal Huruf',e:'🔤',c:'linear-gradient(90deg,#f472b6,#f43f5e)',pool:A},
 {id:'k',n:'MEMBACA (BA, MA)',s:'Suku Kata',e:'📖',c:'linear-gradient(90deg,#f43f5e,#dc2626)',pool:SK},
 {id:'a',n:'ANGKA DASAR',s:'Angka 0-9',e:'🔢',c:'linear-gradient(90deg,#38bdf8,#3b82f6)',pool:NUM},
 {id:'p',n:'PENJUMLAHAN',s:'Matematika',e:'➕',c:'linear-gradient(90deg,#3b82f6,#4f46e5)',add:1,pool:[...Array(19).keys()].map(String)}];
const MX=0.861,MY=0.381;
function go(id){document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');$('hud').style.display='none';$('hero').className='big'}
function pickMode(n){N=n;tab(tabIdx);go('sMisi')}
function tab(i){tabIdx=i;$('tS').className='tab'+(i?'':' on');$('tG').className='tab'+(i?' on':'');
 const el=$('mList');el.innerHTML='';
 if(!i)MS.forEach(m=>{const d=document.createElement('div');d.className='mc';d.style.background=m.c;d.innerHTML=m.e+' '+m.n+'<br><small>'+m.s+'</small>';d.onclick=()=>{mission=m;startGame()};el.appendChild(d)});
 else if(!pk.length)el.textContent='Belum ada soal buatan guru. Klik tombol ⚙️ di menu utama!';
 else pk.forEach(p=>{const d=document.createElement('div');d.className='mc';d.style.background='linear-gradient(90deg,#22c55e,#15803d)';d.innerHTML='🎓 '+p.n+'<br><small>'+p.q.length+' soal</small>';d.onclick=()=>{mission={id:'g'+p.n,pool:p.q};startGame()};el.appendChild(d)})}
function newT(l){const m=mission;
 if(m.add){const mx=[5,7,9,12,15,20][Math.min(5,l.lv-1)],a=Math.floor(Math.random()*(mx+1)),b=Math.floor(Math.random()*(mx+1));l.show=a+' + '+b;l.ans=String(a+b);l.say='Cari hasil dari '+a+' tambah '+b}
 else{let a;const P=poolFor(l);do a=P[Math.floor(Math.random()*P.length)];while(a===l.ans&&P.length>1);l.ans=a;l.show=a;l.say=(m.id=='h'?'Cari huruf ':m.id=='a'?'Cari angka ':'Cari ')+String(a).toLowerCase()}
 l.tg.innerHTML='<b>CARI</b>'+l.show;l.tg.animate([{transform:'translateX(-50%) scale(1.3)'},{transform:'translateX(-50%) scale(1)'}],{duration:300});if(N==1&&G&&G.started){say((l.pre||'')+l.say);l.pre=''}}
function startGame(){
 $('hud').style.display='block';$('hero').className='';document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
 if(G){cancelAnimationFrame(G.raf);G.els.forEach(e=>e.remove())}
 G={t:180,paused:false,lanes:[],els:[],last:performance.now(),over:false};
 for(let i=0;i<N;i++){
  const lane=document.createElement('div');lane.className='lane';lane.style.cssText=`left:${i*100/N}%;width:${100/N}%`;
  const sc=document.createElement('div');sc.className='sc';sc.innerHTML=`<i style="background:${PC[i]}"></i><em class=lv>LV 1</em><span>0</span>`;
  const tg=document.createElement('div');tg.className='tg';
  lane.append(sc,tg);$('app').insertBefore(lane,$('hud'));G.els.push(lane);

 G.raf=requestAnimationFrame(loop);startMusic();setTimeout(()=>{if(!G||G.over)return;G.started=true;say('Ayo mulai! '+(N==1?G.lanes[0].say:'Siapa yang paling cepat?'))},400)}

 else if(String(o.val)===String(l.ans)){l.score++;sfx('pop');sfx('ding');burst(o);shoot(o);{const nl=1+Math.floor(l.score/5);if(nl>l.lv){l.lv=nl;lvUp(l);l.pre='Naik level! '}}newT(l)}

function loop(t){if(G.over)return;const dt=Math.min(.05,(t-G.last)/1000);G.last=t;
 if(!G.paused){G.t-=dt;
  const s=Math.max(0,Math.ceil(G.t));if(s<=5&&s>0&&s!==G.tk){G.tk=s;sfx('tick')}$('timer').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  G.lanes.forEach(l=>{l.sp-=dt;if(l.sp<=0){spawn(l);l.sp=Math.max(.45,(N>2?1.3:1.0)-l.lv*.07)+Math.random()*.4}
   l.bl=l.bl.filter(o=>{if(o.dead)return false;o.y-=o.v*dt;o.el.style.translate=`${Math.sin(G.t*o.f+o.ph)*16}px ${o.y}px`;

const S=Object.assign({m:1,s:1,v:1},L('pb_set')||{});
let ac,mg,mt=null,step=0,nextT=0;
function AC(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.9;mg.connect(ac.destination)}catch(e){}}if(ac&&ac.state=='suspended')ac.resume();return ac}
function tone(f,t,d,ty,v,sl){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function noise(t,d,v,ty,fr){const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.random()*2-1;const sr=ac.createBufferSource();sr.buffer=b;const f=ac.createBiquadFilter();f.type=ty;f.frequency.value=fr;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);sr.connect(f);f.connect(g);g.connect(mg);sr.start(t)}
function sfx(k){if(!S.s||!AC())return;const t=ac.currentTime;
 if(k=='pop'){noise(t,.12,.5,'highpass',1200);tone(500,t,.08,'sine',.3,120)}
 else if(k=='ding'){tone(880,t+.02,.18,'triangle',.18);tone(1320,t+.09,.25,'triangle',.15)}
 else if(k=='wrong')tone(220,t,.22,'square',.1,110);
 else if(k=='bomb'){noise(t,.5,.7,'lowpass',500);tone(120,t,.5,'sine',.5,35)}
 else if(k=='tick')tone(1000,t,.05,'square',.05);
 else if(k=='lv')[659,784,988,1319].forEach((f,i)=>tone(f,t+i*.08,.2,'triangle',.16));else if(k=='win')[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.12,.3,'triangle',.18))}
function sched(){if(!ac)return;if(G&&G.paused&&!G.over){nextT=ac.currentTime+.1;return}
 while(nextT<ac.currentTime+.25){const t=nextT,st=step%32,root=[48,53,55,48][Math.floor(st/8)],f=m=>440*Math.pow(2,(m-69)/12);
  if(st%4==0){tone(f(root),t,.35,'sine',.14);noise(t,.08,.1,'lowpass',200)}
  if(st%8==4)tone(f(root+7),t,.25,'sine',.08);
  if(st%2==1)noise(t,.04,.04,'highpass',7000);
  if([1,0,1,1,0,1,1,0][st%8]&&Math.random()<.9)tone(f(root+12+[0,2,4,7,9][Math.floor(Math.random()*5)]),t,.22,'triangle',.06);
  nextT+=.2381;step++}}

function burst(o){const r=o.el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,c=getComputedStyle(o.el).getPropertyValue('--c')||'#fff';
 for(let i=0;i<14;i++){const p=document.createElement('i'),z=6+Math.random()*8;p.style.cssText=`position:fixed;left:${x}px;top:${y}px;width:${z}px;height:${z*.6}px;background:${i%3?c:'#fff'};z-index:8;pointer-events:none;border-radius:2px`;document.body.appendChild(p);const a=Math.random()*6.28,d=50+Math.random()*90;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+40}px) rotate(${Math.random()*540}deg)`,opacity:0}],{duration:600+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}

for(let i=0;i<16;i++){const e=document.createElement('div'),z=3+Math.random()*7;e.className='sp';e.style.cssText=`left:${Math.random()*100}%;bottom:-20px;width:${z}px;height:${z}px;animation-duration:${10+Math.random()*14}s;animation-delay:-${Math.random()*20}s`;$('app').insertBefore(e,$('hud'))}
